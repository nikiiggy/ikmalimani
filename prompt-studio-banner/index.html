<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Studio Banner Unlimited by ikmalimani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f6f9fc 0%, #edf2f7 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --accent-glow: rgba(99, 102, 241, 0.25);
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --focus-ring: #818cf8;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Layout Header */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 24px 30px;
      border-radius: var(--radius-lg);
      margin-bottom: 30px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title-box h1 {
      font-size: 1.5rem;
      margin: 0;
      font-weight: 700;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .header-title-box span.subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      display: block;
      margin-top: 2px;
    }

    .badge-unlimited {
      background: rgba(99, 102, 241, 0.1);
      color: #4f46e5;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 28px;
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.03);
    }

    .card h2 {
      font-size: 1.05rem;
      margin-top: 0;
      margin-bottom: 20px;
      color: #334155;
      font-weight: 600;
    }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .full { grid-column: span 2; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    textarea { resize: vertical; min-height: 90px; }

    /* Custom Upload Area - Center Aligned */
    .upload-zone {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .upload-btn {
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius-md);
      height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      background: #f8fafc;
      transition: all 0.2s ease;
      color: var(--text-muted);
      padding: 8px;
    }

    .upload-btn:hover {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.03);
      color: #4f46e5;
    }

    .upload-btn .icon-plus {
      font-size: 1.8rem;
      font-weight: 300;
      line-height: 1;
      margin-bottom: 4px;
    }

    .upload-btn span {
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
    }

    .preview-card {
      position: relative;
      height: 110px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .preview-card:hover .preview-overlay { opacity: 1; }

    .btn-copy-img {
      background: #ffffff;
      color: #0f172a;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.15s ease;
    }

    .btn-copy-img:hover { transform: scale(1.05); }

    /* Main Action Buttons */
    .action-group {
      display: flex;
      gap: 14px;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    .btn-primary {
      flex: 2;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px var(--accent-glow);
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      flex: 1;
      background: #ffffff;
      color: #ef4444;
      border: 1px solid #fecaca;
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: #fef2f2;
      border-color: #fca5a5;
    }

    /* Output Console */
    #outputArea {
      font-family: 'JetBrains Mono', Monaco, Consolas, monospace;
      font-size: 0.85rem;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid #1e293b;
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
      line-height: 1.5;
    }

    .btn-copy-main {
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s ease;
    }

    .btn-copy-main:hover { background: #059669; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <!-- MAIN APP CONTAINER -->
  <div class="container">
    <header>
      <div class="header-title-box">
        <h1>Prompt Studio Banner</h1>
        <span class="subtitle">Unlimited by ikmalimani</span>
      </div>
      <div class="badge-unlimited">UNLIMITED ACCESS</div>
    </header>

    <form id="promptForm" onsubmit="event.preventDefault();">
      <!-- 1. Data Informasi -->
      <div class="card">
        <h2>1. Data Informasi</h2>
        <div class="grid">
          <div>
            <label>Judul Utama</label>
            <input type="text" id="judulUtama" placeholder="Contoh: Diskon Spesial Akhir Tahun">
          </div>
          <div>
            <label>Sub Judul</label>
            <input type="text" id="subJudul" placeholder="Contoh: Hemat Hingga 50%">
          </div>
          <div>
            <label>Slogan</label>
            <input type="text" id="slogan" placeholder="Contoh: Kualitas Terbaik, Harga Bersahabat">
          </div>
          <div>
            <label>Call To Action (CTA)</label>
            <input type="text" id="cta" placeholder="Contoh: Beli Sekarang / Hubungi Kami">
          </div>
          <div class="full">
            <label>Informasi Data - Deskripsi</label>
            <textarea id="deskripsi" placeholder="Penjelasan tambahan detail promosi..."></textarea>
          </div>
        </div>
      </div>

      <!-- 2. Panel Kontak & Alamat -->
      <div class="card">
        <h2>2. Panel Kontak & Alamat</h2>
        <div class="grid">
          <div><label>WhatsApp</label><input type="text" id="wa" placeholder="08123456789"></div>
          <div><label>TikTok</label><input type="text" id="tiktok" placeholder="@username_tiktok"></div>
          <div><label>Instagram</label><input type="text" id="ig" placeholder="@username_instagram"></div>
          <div><label>YouTube</label><input type="text" id="yt" placeholder="Nama Channel"></div>
          <div><label>Facebook</label><input type="text" id="fb" placeholder="Username Facebook"></div>
          <div><label>Alamat</label><input type="text" id="alamat" placeholder="Jl. Contoh No. 123"></div>
        </div>
      </div>

      <!-- 3. Bahan Visual -->
      <div class="card">
        <h2>3. Bahan Visual</h2>
        <div class="grid">
          <div>
            <label>Upload Logo</label>
            <div class="upload-zone" id="logoContainer">
              <label class="upload-btn">
                <span class="icon-plus">+</span>
                <span>Tambah Logo</span>
                <input type="file" multiple accept="image/*" onchange="handleFiles(this, 'logoContainer')">
              </label>
            </div>
          </div>
          <div>
            <label>Foto Produk</label>
            <div class="upload-zone" id="produkContainer">
              <label class="upload-btn">
                <span class="icon-plus">+</span>
                <span>Tambah Produk</span>
                <input type="file" multiple accept="image/*" onchange="handleFiles(this, 'produkContainer')">
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. Spesifikasi & Referensi -->
      <div class="card">
        <h2>4. Spesifikasi & Referensi</h2>
        <div class="grid">
          <div>
            <label>Orientasi</label>
            <select id="orientasi">
              <option value="Landscape">Landscape</option>
              <option value="Portrait">Portrait</option>
              <option value="Square (1:1)">Square (1:1)</option>
            </select>
          </div>
          <div>
            <label>Ukuran</label>
            <input type="text" id="ukuran" placeholder="Contoh: 1920x1080 px / 10x5 cm">
          </div>
          <div>
            <label>Warna Dominan</label>
            <input type="text" id="warna" placeholder="Contoh: Biru Navy dan Emas">
          </div>
          <div>
            <label>Tema Desain (Opsional)</label>
            <input type="text" id="tema" placeholder="Contoh: Minimalis Modern, Cyberpunk">
          </div>
          <div class="full">
            <label>Upload Referensi Desain</label>
            <div class="upload-zone" id="refContainer">
              <label class="upload-btn">
                <span class="icon-plus">+</span>
                <span>Tambah Referensi</span>
                <input type="file" multiple accept="image/*" onchange="handleFiles(this, 'refContainer')">
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 5. Perintah Khusus -->
      <div class="card">
        <h2>5. Prompt Pendukung & Perintah Khusus</h2>
        <textarea id="perintahKhusus" placeholder="Tambahkan instruksi spesifik untuk AI (misal: pencahayaan soft, bayangan realistis, tata letak simetris)..."></textarea>
      </div>

      <!-- Tombol Aksi -->
      <div class="action-group">
        <button type="button" id="btnGenerate" class="btn-primary" onclick="generatePrompt()">Generate Structured Prompt</button>
        <button type="button" class="btn-secondary" onclick="resetForm()">Kosongkan Form</button>
      </div>
    </form>

    <!-- Output Console -->
    <div class="card">
      <h2>Prompt Output Structure</h2>
      <textarea id="outputArea" readonly rows="12" placeholder="Struktur prompt JSON Object akan muncul di sini..."></textarea>
      <button type="button" class="btn-copy-main" onclick="copyOutput()">Salin Prompt Output</button>
    </div>
  </div>

  <!-- INLINE JAVASCRIPT LOGIC -->
  <script>
    let uploadedData = { logoContainer: [], produkContainer: [], refContainer: [] };

    function handleFiles(input, containerId) {
      const container = document.getElementById(containerId);

      Array.from(input.files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const base64Data = e.target.result;
          const fileIndex = uploadedData[containerId].length;
          uploadedData[containerId].push({ name: file.name, data: base64Data });

          const card = document.createElement('div');
          card.className = 'preview-card';
          card.innerHTML = `
            <img src="${base64Data}" alt="preview">
            <div class="preview-overlay">
              <button class="btn-copy-img" onclick="copyImageBase64('${containerId}', ${fileIndex})">Copy Base64</button>
            </div>
          `;
          container.insertBefore(card, container.lastElementChild);
        };
        reader.readAsDataURL(file);
      });
    }

    // Salin string Base64 gambar ke clipboard secara silent
    function copyImageBase64(category, index) {
      const item = uploadedData[category][index];
      if (item) {
        navigator.clipboard.writeText(item.data);
      }
    }

    // Generate prompt berformat JSON Object secara bebas dan unlimited
    function generatePrompt() {
      const structuredPrompt = {
        PROMPT_CONFIG: {
          SYSTEM_AUTHOR: "Prompt Studio Banner Unlimited by ikmalimani",
          ACCESS_TYPE: "SINGLE_FILE_UNLIMITED",
          VERSION: "4.5-OFFLINE"
        },
        DATA_INFORMASI: {
          JUDUL_UTAMA: document.getElementById('judulUtama').value || "-",
          SUB_JUDUL: document.getElementById('subJudul').value || "-",
          DESKRIPSI: document.getElementById('deskripsi').value || "-",
          SLOGAN: document.getElementById('slogan').value || "-",
          CALL_TO_ACTION: document.getElementById('cta').value || "-"
        },
        PANEL_KONTAK_ALAMAT: {
          WHATSAPP: document.getElementById('wa').value || "-",
          TIKTOK: document.getElementById('tiktok').value || "-",
          INSTAGRAM: document.getElementById('ig').value || "-",
          YOUTUBE: document.getElementById('yt').value || "-",
          FACEBOOK: document.getElementById('fb').value || "-",
          ALAMAT: document.getElementById('alamat').value || "-"
        },
        SPESIFIKASI_REFERENSI: {
          ORIENTASI: document.getElementById('orientasi').value,
          UKURAN: document.getElementById('ukuran').value || "-",
          WARNA_DOMINAN: document.getElementById('warna').value || "-",
          TEMA_DESAIN: document.getElementById('tema').value || "-",
          TOTAL_GAMBAR_REFERENSI: uploadedData.refContainer.length
        },
        RINGKASAN_ASSET_VISUAL: {
          TOTAL_LOGO: uploadedData.logoContainer.length,
          TOTAL_FOTO_PRODUK: uploadedData.produkContainer.length
        },
        PERINTAH_KHUSUS: document.getElementById('perintahKhusus').value || "-",
        AI_DIRECTIVE: "Generate visual banner desain profesional modern berbasis data terstruktur di atas. Susun komposisi hirarki visual yang seimbang antara Judul Utama, Foto Produk, dan Kontak."
      };

      const finalOutput = JSON.stringify(structuredPrompt, null, 2);
      document.getElementById('outputArea').value = finalOutput;
    }

    // Salin prompt output utama secara silent
    function copyOutput() {
      const output = document.getElementById('outputArea');
      if (!output.value) return;
      output.select();
      navigator.clipboard.writeText(output.value);
    }

    // Kosongkan seluruh data form
    function resetForm() {
      document.getElementById('promptForm').reset();
      document.getElementById('outputArea').value = '';
      
      ['logoContainer', 'produkContainer', 'refContainer'].forEach(id => {
        const container = document.getElementById(id);
        const uploadBtn = container.querySelector('.upload-btn');
        container.innerHTML = '';
        container.appendChild(uploadBtn);
        uploadedData[id] = [];
      });
    }
  </script>
</body>
</html>
