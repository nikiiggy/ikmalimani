<!-- Module Script -->
  <script type="module">
    import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm';

    const fileInput = document.getElementById('fileInput');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const statusPercent = document.getElementById('statusPercent');
    const statusDetail = document.getElementById('statusDetail');
    const progressBar = document.getElementById('progressBar');
    const originalImg = document.getElementById('originalImg');
    const resultImg = document.getElementById('resultImg');
    const downloadBtn = document.getElementById('downloadBtn');

    let processedBlobUrl = null;

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    async function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('Harap masukkan file gambar valid!');
        return;
      }

      const originalUrl = URL.createObjectURL(file);
      originalImg.src = originalUrl;
      originalImg.style.display = 'block';

      resultImg.style.display = 'none';
      downloadBtn.disabled = true;
      statusContainer.style.display = 'block';
      progressBar.style.width = '0%';
      statusPercent.innerText = '0%';
      statusText.innerText = 'Mengunduh Model ONNX...';
      statusDetail.innerText = 'Mengunduh aset AI dari CDN unpkg...';

      try {
        // PERBAIKAN UTAMA UNTUK GITHUB PAGES:
        // Menambahkan publicPath agar CDN model ONNX tidak kena blokir CORS/404
        const blob = await imglyRemoveBackground(file, {
          publicPath: 'https://unpkg.com/@imgly/background-removal-data@1.5.5/dist/',
          progress: (key, current, total) => {
            if (total > 0) {
              const percent = Math.round((current / total) * 100);
              progressBar.style.width = `${percent}%`;
              statusPercent.innerText = `${percent}%`;

              if (key.includes('fetch') || key.includes('download')) {
                statusText.innerText = '📥 Mengunduh Model ONNX...';
                statusDetail.innerText = `File: ${key} (${(current / (1024 * 1024)).toFixed(1)}MB / ${(total / (1024 * 1024)).toFixed(1)}MB)`;
              } else {
                statusText.innerText = '⚡ Memproses Gambar dengan AI...';
                statusDetail.innerText = 'Menganalisis subjek dan menghapus latar belakang...';
              }
            }
          }
        });

        if (processedBlobUrl) URL.revokeObjectURL(processedBlobUrl);
        processedBlobUrl = URL.createObjectURL(blob);

        resultImg.src = processedBlobUrl;
        resultImg.style.display = 'block';
        statusContainer.style.display = 'none';

        downloadBtn.disabled = false;
        downloadBtn.onclick = () => {
          const a = document.createElement('a');
          a.href = processedBlobUrl;
          a.download = `ikmal-bg-remover-${Date.now()}.png`;
          a.click();
        };

      } catch (error) {
        console.error('Error Detail:', error);
        statusText.innerText = '❌ Gagal memproses gambar.';
        statusDetail.innerText = 'Coba buka Inspect Element (F12) Console untuk melihat detail error.';
        progressBar.style.width = '0%';
      }
    }
  </script>
