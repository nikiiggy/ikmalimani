<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Background Remover by ikmal imani</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --primary-accent: #0284c7;
      --gradient-start: #06b6d4;
      --gradient-end: #3b82f6;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    header .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(6, 182, 212, 0.08);
      border: 1px solid rgba(6, 182, 212, 0.2);
      color: var(--primary-accent);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      max-width: 900px;
      width: 100%;
      padding: 35px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
    }

    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      background: #f8fafc;
    }

    .upload-zone:hover {
      border-color: var(--gradient-start);
      background: #f0f9ff;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.1);
    }

    .upload-icon {
      width: 50px;
      height: 50px;
      margin-bottom: 14px;
      fill: none;
      stroke: var(--primary-accent);
    }

    .upload-zone p {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .upload-zone span {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: block;
      margin-top: 4px;
    }

    #fileInput {
      display: none;
    }

    /* Progress & Status Indicator */
    .status-container {
      margin-top: 25px;
      display: none;
      background: #f0f9ff;
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 14px;
      padding: 20px;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--primary-accent);
      font-weight: 700;
    }

    .status-percent {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
      transition: width 0.2s ease;
    }

    .status-step-detail {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Preview Layout */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 35px;
    }

    .preview-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
    }

    .preview-card h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .img-box {
      width: 100%;
      height: 280px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #f1f5f9;
      background-color: #f8fafc;
    }

    .img-box.transparent-bg {
      background-image: 
        linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #ffffff;
    }

    .img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Action Buttons */
    .action-area {
      margin-top: 30px;
      text-align: center;
    }

    .btn-futuristic {
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px 32px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 10px 20px -5px rgba(6, 182, 212, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-futuristic:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 24px -5px rgba(6, 182, 212, 0.5);
    }

    .btn-futuristic:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    footer {
      margin-top: auto;
      padding-top: 40px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <header>
    <h1>AI Background Remover</h1>
    <p>by ikmal imani</p>
    <div class="badge">Client-Side AI • Gratis &amp; Privat</div>
  </header>

  <div class="main-card">
    <div class="upload-zone" id="dropZone">
      <svg class="upload-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <p>Pilih Foto atau Seret ke Sini</p>
      <span>Format PNG, JPG, WebP</span>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- Loading Bar dengan Detail Pengunduhan ONNX -->
    <div class="status-container" id="statusContainer">
      <div class="status-header">
        <span class="status-text" id="statusText">Menyiapkan AI...</span>
        <span class="status-percent" id="statusPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="status-step-detail" id="statusDetail">Mengunduh aset model ONNX...</div>
    </div>

    <!-- Preview Box -->
    <div class="preview-grid">
      <div class="preview-card">
        <h3>Gambar Asli</h3>
        <div class="img-box">
          <img id="originalImg" src="" alt="" style="display:none;">
        </div>
      </div>
      <div class="preview-card">
        <h3>Hasil Pemotongan</h3>
        <div class="img-box transparent-bg">
          <img id="resultImg" src="" alt="" style="display:none;">
        </div>
      </div>
    </div>

    <!-- Tombol Download -->
    <div class="action-area">
      <button class="btn-futuristic" id="downloadBtn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Unduh PNG Transparan
      </button>
    </div>
  </div>

  <footer>
    &copy; 2026 AI Background Remover by ikmal imani. Powered by WebAssembly &amp; ONNX.
  </footer>

  <!-- Module Script -->
  <script type="module">
    import imglyRemoveBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const statusPercent = document.getElementById('statusPercent');
    const statusDetail = document.getElementById('statusDetail');
    const progressBar = document.getElementById('progressBar');
    const originalImg = document.getElementById('originalImg');
    const resultImg = document.getElementById('resultImg');
    const downloadBtn = document.getElementById('downloadBtn');

    let processedBlobUrl = null;

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'var(--gradient-start)';
      dropZone.style.background = '#f0f9ff';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.borderColor = '#cbd5e1';
      dropZone.style.background = '#f8fafc';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#cbd5e1';
      dropZone.style.background = '#f8fafc';
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    async function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('Harap masukkan file gambar valid!');
        return;
      }

      const originalUrl = URL.createObjectURL(file);
      originalImg.src = originalUrl;
      originalImg.style.display = 'block';

      resultImg.style.display = 'none';
      downloadBtn.disabled = true;
      statusContainer.style.display = 'block';
      progressBar.style.width = '0%';
      statusPercent.innerText = '0%';
      statusText.innerText = 'Mengunduh Model ONNX...';
      statusDetail.innerText = 'Mengunduh bobot AI dari CDN (hanya saat pertama kali)...';

      try {
        const blob = await imglyRemoveBackground(file, {
          progress: (key, current, total) => {
            if (total > 0) {
              const percent = Math.round((current / total) * 100);
              progressBar.style.width = `${percent}%`;
              statusPercent.innerText = `${percent}%`;

              // Membedakan tahap unduh model vs pemrosesan AI
              if (key.includes('fetch') || key.includes('download')) {
                statusText.innerText = '📥 Mengunduh Model ONNX...';
                statusDetail.innerText = `File: ${key} (${(current / (1024 * 1024)).toFixed(1)}MB / ${(total / (1024 * 1024)).toFixed(1)}MB)`;
              } else {
                statusText.innerText = '⚡ Memproses Gambar dengan AI...';
                statusDetail.innerText = 'Menganalisis subjek dan menghapus latar belakang...';
              }
            }
          }
        });

        if (processedBlobUrl) URL.revokeObjectURL(processedBlobUrl);
        processedBlobUrl = URL.createObjectURL(blob);

        resultImg.src = processedBlobUrl;
        resultImg.style.display = 'block';
        statusContainer.style.display = 'none';

        downloadBtn.disabled = false;
        downloadBtn.onclick = () => {
          const a = document.createElement('a');
          a.href = processedBlobUrl;
          a.download = `ikmal-bg-remover-${Date.now()}.png`;
          a.click();
        };

      } catch (error) {
        console.error(error);
        statusText.innerText = '❌ Gagal memproses gambar.';
        statusDetail.innerText = 'Pastikan koneksi internet stabil untuk mengunduh model ONNX.';
        progressBar.style.width = '0%';
      }
    }
  </script>
</body>
</html>
