<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Halaman Tidak Ditemukan | Ikmal Imani</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23C5A059'/><text x='50%' y='65%' font-family='Georgia, serif' font-size='50' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'>II</text></svg>">

    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-cream: #FAF7F2;
            --card-cream: #FFFFFF;
            --text-dark: #33302E;
            --text-muted: #66605C;
            --accent-gold: #C5A059;
            --border-color: #E8E2D9;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #EAE6DF;
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-wrapper {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-cream);
            min-height: 100vh;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 24px;
        }

        h1, h2 {
            font-family: 'Cormorant Garamond', serif;
        }

        .error-code {
            font-size: 80px;
            font-weight: 700;
            color: var(--accent-gold);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .error-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-width: 320px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--text-dark);
            color: #FFFFFF;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 30px;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(51, 48, 46, 0.2);
        }

        .btn-home:hover {
            background-color: var(--accent-gold);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="mobile-wrapper">
        <div class="error-code">404</div>
        <h2 class="error-title">Halaman Tidak Ditemukan</h2>
        <p class="error-desc">Waduh, link yang kamu tuju salah, sudah dihapus, atau tidak pernah ada.</p>

        <a href="https://www.ikmalimani.my.id/" class="btn-home">
            <i class="fa-solid fa-house"></i> Kembali ke Beranda
        </a>
    </div>

</body>
</html>
