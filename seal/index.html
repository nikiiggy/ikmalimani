<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seal Online Item ID Database</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .toast {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

  <div class="max-w-6xl mx-auto w-full">
    <!-- Header -->
    <header class="text-center my-6">
      <h1 class="text-3xl md:text-5xl font-extrabold text-amber-400 tracking-wide drop-shadow-md">
        SEAL ONLINE ITEM ID FINDER
      </h1>
      <p class="text-slate-400 mt-2 text-sm md:text-base">
        Database Item Seal Online (Auto-load dari <code class="text-amber-300">seal_id.txt</code>)
      </p>
    </header>

    <!-- Status & Search Bar -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 md:p-6 mb-6 shadow-lg flex flex-col md:flex-row gap-4 justify-between items-center">
      <div class="relative w-full md:w-2/3">
        <input type="text" id="searchInput" placeholder="Cari ID atau nama item (contoh: Geranium, Log, dll)..." 
          class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-amber-400 transition" disabled>
      </div>
      <div class="flex gap-4 w-full md:w-1/3 justify-between md:justify-end items-center text-sm text-slate-400">
        <div>
          Status: <span id="statusText" class="text-amber-400 font-semibold">Memuat data...</span>
        </div>
        <div>
          Total: <span id="totalItems" class="font-bold text-amber-400 text-lg">0</span>
        </div>
      </div>
    </div>

    <!-- Table Result -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-900 text-amber-400 text-sm uppercase tracking-wider border-b border-slate-700">
              <th class="py-3 px-4 w-28">ID Item</th>
              <th class="py-3 px-4">Nama Item</th>
              <th class="py-3 px-4 w-32 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="itemTableBody" class="divide-y divide-slate-700 text-sm">
            <tr>
              <td colspan="3" class="py-8 text-center text-slate-500">
                Memuat database <code class="text-amber-400">seal_id.txt</code>...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination Controls -->
      <div class="bg-slate-900 p-4 flex flex-col sm:flex-row justify-between items-center gap-3 border-t border-slate-700">
        <div class="text-xs text-slate-400">
          Menampilkan <span id="pageStart">0</span> - <span id="pageEnd">0</span> dari <span id="pageTotal">0</span> item
        </div>
        <div class="flex gap-2">
          <button id="prevBtn" onclick="changePage(-1)" disabled class="px-3 py-1.5 bg-slate-700 text-slate-300 rounded hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed text-xs font-semibold">
            &larr; Prev
          </button>
          <span id="pageIndicator" class="px-3 py-1.5 text-xs text-slate-300 font-semibold self-center">
            Halaman 1
          </span>
          <button id="nextBtn" onclick="changePage(1)" disabled class="px-3 py-1.5 bg-slate-700 text-slate-300 rounded hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed text-xs font-semibold">
            Next &rarr;
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast fixed bottom-5 right-5 bg-amber-500 text-slate-950 px-4 py-2 rounded-lg font-bold shadow-lg opacity-0 pointer-events-none transform translate-y-2">
    ID berhasil dicopy!
  </div>

  <script>
    let allItems = [];
    let filteredItems = [];
    let currentPage = 1;
    const itemsPerPage = 50;

    const searchInput = document.getElementById('searchInput');
    const itemTableBody = document.getElementById('itemTableBody');
    const totalItemsEl = document.getElementById('totalItems');
    const statusText = document.getElementById('statusText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    const pageStart = document.getElementById('pageStart');
    const pageEnd = document.getElementById('pageEnd');
    const pageTotal = document.getElementById('pageTotal');
    const toast = document.getElementById('toast');

    // Auto load file seal_id.txt saat halaman dibuka
    window.addEventListener('DOMContentLoaded', () => {
      fetch('seal_id.txt')
        .then(response => {
          if (!response.ok) {
            throw new Error('File seal_id.txt tidak ditemukan!');
          }
          return response.text();
        })
        .then(text => {
          parseTxtData(text);
          statusText.textContent = '✅ Ready';
          statusText.className = 'text-emerald-400 font-semibold';
          searchInput.disabled = false;
        })
        .catch(err => {
          console.error(err);
          statusText.textContent = '❌ Gagal memuat file';
          statusText.className = 'text-rose-400 font-semibold';
          itemTableBody.innerHTML = `
            <tr>
              <td colspan="3" class="py-8 text-center text-rose-400 font-semibold">
                Gagal membaca file <code class="bg-slate-900 px-2 py-1 rounded">seal_id.txt</code>.<br> Pastikan file tersebut berada di folder yang sama dengan <code class="bg-slate-900 px-2 py-1 rounded">index.html</code>.
              </td>
            </tr>`;
        });
    });

    // Parsing data berdasarkan delimiter Pipe (|)
    function parseTxtData(text) {
      const lines = text.split(/\r?\n/);
      allItems = [];

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        const parts = trimmed.split('|');
        if (parts.length >= 2) {
          const id = parts[0].trim();
          const name = parts[1].trim();

          // Hanya masukkan item yang mempunyai nama valid (bukan 0)
          if (name !== '' && name !== '0') {
            allItems.push({ id, name });
          }
        }
      });

      filteredItems = [...allItems];
      currentPage = 1;
      renderTable();
    }

    // Live Filter
    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase().trim();
      filteredItems = allItems.filter(item => 
        item.id.toLowerCase().includes(query) || 
        item.name.toLowerCase().includes(query)
      );
      currentPage = 1;
      renderTable();
    });

    // Render Tabel
    function renderTable() {
      totalItemsEl.textContent = filteredItems.length.toLocaleString();
      pageTotal.textContent = filteredItems.length.toLocaleString();

      if (filteredItems.length === 0) {
        itemTableBody.innerHTML = `
          <tr>
            <td colspan="3" class="py-8 text-center text-slate-500">
              Tidak ada item yang cocok dengan pencarian.
            </td>
          </tr>`;
        updatePaginationInfo(0, 0, 0);
        return;
      }

      const totalPages = Math.ceil(filteredItems.length / itemsPerPage);
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = Math.min(startIndex + itemsPerPage, filteredItems.length);
      const currentData = filteredItems.slice(startIndex, endIndex);

      let html = '';
      currentData.forEach(item => {
        html += `
          <tr class="hover:bg-slate-750 border-b border-slate-700/50 transition">
            <td class="py-3 px-4 font-mono font-bold text-amber-400">${item.id}</td>
            <td class="py-3 px-4 text-slate-200">${escapeHtml(item.name)}</td>
            <td class="py-3 px-4 text-center">
              <button onclick="copyToClipboard('${item.id}')" 
                class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1 rounded text-xs transition active:scale-95">
                Copy ID
              </button>
            </td>
          </tr>`;
      });

      itemTableBody.innerHTML = html;
      updatePaginationInfo(startIndex + 1, endIndex, totalPages);
    }

    function updatePaginationInfo(start, end, totalPages) {
      pageStart.textContent = start.toLocaleString();
      pageEnd.textContent = end.toLocaleString();
      pageIndicator.textContent = totalPages > 0 ? `Halaman ${currentPage} / ${totalPages}` : 'Halaman 0';

      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages || totalPages === 0;
    }

    function changePage(direction) {
      currentPage += direction;
      renderTable();
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`ID ${text} berhasil dicopy!`);
      });
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
      }, 2000);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
