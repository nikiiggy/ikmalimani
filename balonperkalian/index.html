<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Balon Perkalian — by Ikmal Imani 🎈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-a:#fde8d3; --sky-b:#f7c9de; --sky-c:#d9b8fb;
    --grass-a:#8fd19e; --grass-b:#5fb977;
    --ink:#3a2e57; --cream:#fffcf6;
    --coral:#ff6f61; --gold:#ffb703; --teal:#00b4a6; --violet:#8a5cf6; --pink:#ff7fae; --blue:#4ea8de;
    --card-shadow: 0 14px 0 rgba(58,46,87,.12), 0 20px 30px rgba(58,46,87,.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Nunito',sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
    background: linear-gradient(180deg,var(--sky-a) 0%, var(--sky-b) 55%, var(--sky-c) 100%);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sun{position:absolute; width:clamp(90px,16vw,180px); height:clamp(90px,16vw,180px); border-radius:50%; top:6%; right:8%;
       background:radial-gradient(circle at 35% 35%, #fff6cf, #ffd166 60%, #ffb703 100%); box-shadow:0 0 60px rgba(255,183,3,.5); pointer-events:none;}
  .ground{position:absolute; bottom:0; left:0; width:100%; height:14%; background:linear-gradient(180deg,var(--grass-a),var(--grass-b)); pointer-events:none;
          border-top-left-radius:50% 30px; border-top-right-radius:50% 30px;}
  .bunting{position:absolute; top:0; left:0; width:100%; height:22px; display:flex; justify-content:space-evenly; pointer-events:none; z-index:1;}
  .flag{width:16px; height:20px; clip-path:polygon(0 0,100% 0,50% 100%);}
  @media (prefers-reduced-motion:no-preference){
    .balloon-wrapper{ animation: floatSlow 4.2s ease-in-out infinite alternate; }
    .balloon-wrapper:nth-child(2n){ animation-delay:-1.2s; }
    .balloon-wrapper:nth-child(3n){ animation-delay:-2.4s; }
  }
  @keyframes floatSlow{0%{transform:translateY(0) rotate(-2.5deg);}100%{transform:translateY(-10px) rotate(2.5deg);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}
  .shake{animation:shake .4s ease-in-out;}
  @keyframes pop-in{0%{transform:scale(.6); opacity:0;}70%{transform:scale(1.06);}100%{transform:scale(1); opacity:1;}}

  .stage{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; max-width:900px; margin:0 auto; padding:10px 12px;}

  header{display:flex; align-items:center; justify-content:space-between; gap:8px; background:rgba(255,252,246,.85); backdrop-filter:blur(6px);
         border-radius:20px; padding:8px 14px; border:2px solid #fff; box-shadow:var(--card-shadow);}
  .stat{display:flex; align-items:center; gap:6px; font-weight:800; color:var(--ink);}
  .stat .emoji{font-size:1.3rem;}
  .stat .num{font-family:'Baloo 2',cursive; font-size:1.3rem; color:var(--coral);}
  #bestNum{color:var(--violet);}
  .pill{background:#eef1ff; color:var(--ink); font-weight:800; padding:5px 14px; border-radius:999px; font-size:.85rem; border:2px solid #dfe3ff;}
  .icon-btn{background:#fff; border:2px solid #ffd7d0; color:#c0392b; width:36px; height:36px; border-radius:50%; font-size:1.05rem; cursor:pointer;}
  .icon-btn:focus-visible, .mode-btn:focus-visible, button:focus-visible, .balloon-wrapper:focus-visible{outline:3px solid #4ea8de; outline-offset:2px;}

  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; min-height:0;}

  #questionCard{background:var(--cream); border:3px solid #fff; border-radius:28px; box-shadow:var(--card-shadow); padding:14px 26px; text-align:center; animation:pop-in .35s ease-out;}
  #questionCard p{margin:0 0 2px; font-weight:800; letter-spacing:.3px; color:#b7a9d6; font-size:.75rem;}
  #questionText{font-family:'Baloo 2',cursive; font-weight:800; color:var(--violet); font-size:clamp(2rem,7vw,3.4rem); line-height:1;}

  #balloonArea{width:100%; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(10px,3vw,26px); max-width:520px; padding:6px 10px;}
  @media (min-width:640px){ #balloonArea{grid-template-columns:repeat(4,minmax(0,1fr));} }
  .balloon-wrapper{display:flex; flex-direction:column; align-items:center; cursor:pointer;}
  
  /* UKURAN FONT BALON SUDAH DIBESARKAN DI SINI */
  .balloon{width:100%; aspect-ratio:.85; max-width:110px; border-radius:50% 50% 50% 50% / 42% 42% 58% 58%; display:flex; align-items:center; justify-content:center;
            font-family:'Baloo 2',cursive; font-weight:800; color:#fff; text-shadow:1px 2px 3px rgba(0,0,0,.3); 
            font-size:clamp(1.8rem,6.5vw,2.8rem);
            box-shadow:inset -6px -6px 10px rgba(0,0,0,.16), inset 6px 6px 10px rgba(255,255,255,.4); position:relative; margin:0 auto;}
  
  .balloon::before{content:'';position:absolute; top:14%; left:18%; width:18%; height:22%; background:rgba(255,255,255,.5); border-radius:50%; transform:rotate(-25deg);}
  .balloon-knot{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid currentColor; margin-top:-1px;}
  .balloon-string{width:2px; height:clamp(14px,2.5vw,26px); background:rgba(255,255,255,.7);}

  #feedback{height:34px; display:flex; align-items:center; justify-content:center;}
  #feedbackText{font-weight:800; padding:5px 18px; border-radius:999px; box-shadow:0 4px 10px rgba(0,0,0,.15); font-size:.95rem;}

  #popCanvas{position:fixed; inset:0; pointer-events:none; z-index:30;}

  #startScreen{position:absolute; inset:8px; background:var(--cream); z-index:40; border-radius:32px; border:3px solid #fff; box-shadow:var(--card-shadow);
                display:flex; flex-direction:column; align-items:center; text-align:center; padding:16px; overflow-y:auto;}
  #startScreen h1{font-family:'Baloo 2',cursive; font-size:clamp(1.4rem,5vw,2.3rem); color:var(--violet); margin:2px 0 0;}
  #startScreen .tagline{color:#a094c2; font-weight:800; font-size:.8rem; margin:2px 0 8px;}
  .modes{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; width:100%; max-width:420px; margin:auto 0;}
  .mode-btn{font-family:'Nunito',sans-serif; font-weight:800; padding:10px 4px; font-size:.85rem; border-radius:14px; border:2px solid #e6def7; background:#fff; color:var(--violet); cursor:pointer;}
  .mode-btn.active{background:var(--violet); color:#fff; border-color:#6d3ff0;}
  .mode-all{grid-column:1/-1; background:linear-gradient(90deg,var(--coral),var(--pink)); color:#fff; border:none;}
  .mode-all.active{outline:3px solid var(--gold);}
  .primary-btn{width:100%; max-width:420px; padding:14px; font-family:'Baloo 2',cursive; font-weight:700; font-size:1.3rem; color:#fff; border:none; border-radius:20px; cursor:pointer;
                background:linear-gradient(180deg,#59d896,#2fb873); box-shadow:0 6px 0 #1f8c58; margin-top:10px;}
  .primary-btn:active{transform:translateY(4px); box-shadow:0 2px 0 #1f8c58;}
  .secondary-btn{width:100%; max-width:420px; padding:11px; font-weight:800; font-size:.9rem; color:#8a5a00; background:#ffd166; border:none; border-radius:16px; cursor:pointer; margin-top:8px;}

  #tableModal{display:none; position:fixed; inset:0; z-index:50; background:rgba(58,46,87,.55); align-items:center; justify-content:center; padding:12px;}
  #tableModal.show{display:flex;}
  #tableModalContent{background:#fff; border-radius:24px; padding:16px; width:100%; max-width:640px; max-height:90vh; display:flex; flex-direction:column; border:3px solid #ffd166;}
  #tableModalContent table{width:100%; border-collapse:collapse; text-align:center;}
  #tableModalContent th,#tableModalContent td{border:1px solid #ffe8b3; padding:6px 3px; font-size:.78rem; font-weight:800; color:#5b4630;}
  #tableModalContent th{background:#ffb703; color:#5c3d00;}
  td.hl{background:#ffe08a; color:#7a4a00;}
  .print-header{display:none;}

  @media print{
    @page{size:A4 landscape; margin:2cm;}
    body{background:#fff !important;}
    #popCanvas,.sun,.ground,.bunting,#startScreen,header,main,#feedback,.modal-no-print{display:none !important;}
    #tableModal{position:absolute; inset:0; background:#fff; display:flex; align-items:center; justify-content:center;}
    #tableModalContent{border:4px solid #ffb703; box-shadow:none; width:100%;}
    .print-header{display:block; text-align:center; margin-bottom:10px;}
    th,td{font-size:15pt !important; padding:10px 4px !important;}
    th{font-size:16pt !important;}
    td.hl{font-size:16pt !important;}
  }
</style>
</head>
<body>
  <div class="bunting" id="bunting"></div>
  <div class="sun"></div>
  <div class="ground"></div>
  <canvas id="popCanvas"></canvas>

  <div class="stage">
    <header id="topBar" style="display:none;">
      <div class="stat"><span class="emoji">⭐</span><span id="scoreNum" class="num">0</span></div>
      <div class="stat"><span class="emoji">🔥</span><span id="streakNum" class="num">0</span></div>
      <div class="pill" id="modeTag">1–10 Campur</div>
      <div class="stat"><span class="emoji">🏆</span><span id="bestNum" class="num">0</span></div>
      <button class="icon-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
      <button class="icon-btn" onclick="resetToStart()">🚪</button>
    </header>

    <main id="gameBoard" style="display:none;">
      <div id="questionCard">
        <p>Berapa hasilnya?</p>
        <div id="questionText">4 × 7</div>
      </div>
      <div id="balloonArea"></div>
    </main>

    <div id="feedback"><span id="feedbackText" style="display:none;"></span></div>

    <div id="startScreen">
      <div style="font-size:clamp(2.2rem,9vw,3.5rem);">🎈</div>
      <h1>Balon Perkalian</h1>
      <p class="tagline">by Ikmal Imani</p>
      <div class="modes">
        <button class="mode-btn mode-all active" onclick="selectMode('all')" id="btn-mode-all">🌟 1–10 Campur</button>
        <div id="modeGrid" style="display:contents;"></div>
      </div>
      <button class="primary-btn" onclick="startGame()">Mulai Main 🚀</button>
      <button class="secondary-btn" onclick="openTableModal()">📖 Kunci Jawaban (Tabel Perkalian)</button>
    </div>
  </div>

  <div id="tableModal">
    <div id="tableModalContent">
      <div class="print-header">
        <div style="font-size:22pt;font-weight:900;color:#6d3ff0;">🎈 Balon Perkalian 🎈</div>
        <p style="font-size:13pt;font-weight:800;color:#c76b00;">Kunci Jawaban Tabel Perkalian 1–10 • by Ikmal Imani</p>
      </div>
      <div class="modal-no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="color:#3a2e57;font-size:1.1rem;">📖 Tabel Perkalian 1–10</strong>
        <button class="icon-btn" onclick="closeTableModal()">✕</button>
      </div>
      <div style="overflow:auto;flex:1;" id="tableWrap"></div>
      <div class="modal-no-print" style="display:flex;gap:8px;margin-top:10px;">
        <button class="primary-btn" style="background:linear-gradient(180deg,#5b8def,#2f66d8); box-shadow:0 6px 0 #1e469c;" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
        <button class="secondary-btn" style="margin-top:0;" onclick="closeTableModal()">Tutup</button>
      </div>
    </div>
  </div>

<script>
const COLORS=['#ff6f61','#4ea8de','#00b4a6','#ffb703','#8a5cf6','#ff7fae'];
let score=0, streak=0, best=0, muted=false, selectedMode='all', currentQuestion={};

// bunting flags
const bunting=document.getElementById('bunting');
for(let i=0;i<14;i++){const f=document.createElement('div');f.className='flag';f.style.background=COLORS[i%COLORS.length];bunting.appendChild(f);}

// mode buttons 1-10
const modeGrid=document.getElementById('modeGrid');
for(let i=1;i<=10;i++){
  const b=document.createElement('button');
  b.className='mode-btn'; b.id='btn-mode-'+i; b.textContent='Perkalian '+i;
  b.onclick=()=>selectMode(i);
  modeGrid.appendChild(b);
}

// multiplication table
const tableWrap=document.getElementById('tableWrap');
let html='<table><thead><tr><th>×</th>';
for(let c=1;c<=10;c++) html+=`<th>${c}</th>`;
html+='</tr></thead><tbody>';
for(let r=1;r<=10;r++){
  html+=`<tr><td class="hl">${r}</td>`;
  for(let c=1;c<=10;c++) html+=`<td>${r*c}</td>`;
  html+='</tr>';
}
html+='</tbody></table>';
tableWrap.innerHTML=html;

try{ best=parseInt(localStorage.getItem('balonPerkalianBest')||'0'); document.getElementById('bestNum').textContent=best; }catch(e){}

let audioCtx=null;
function initAudio(){ const AC=window.AudioContext||window.webkitAudioContext; if(!audioCtx) audioCtx=new AC(); if(audioCtx.state==='suspended') audioCtx.resume(); }
function beep(freq,type,dur,vol,glideTo){
  if(!audioCtx||muted) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo,audioCtx.currentTime+dur);
  gain.gain.setValueAtTime(vol,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+dur);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+dur);
}
const playPop=()=>beep(450,'sine',.1,.8,90);
const playWrong=()=>beep(180,'sawtooth',.2,.4,110);
function toggleMute(){ muted=!muted; document.getElementById('muteBtn').textContent=muted?'🔇':'🔊'; }

const canvas=document.getElementById('popCanvas'), ctx=canvas.getContext('2d');
let particles=[];
function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight;}
addEventListener('resize',resizeCanvas); resizeCanvas();
function burst(x,y,color,count){
  for(let i=0;i<count;i++) particles.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,r:Math.random()*6+4,color,a:1});
}
(function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.a*=.92; p.r*=.95;
    ctx.save(); ctx.globalAlpha=p.a; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.restore();
    if(p.a<.05) particles.splice(i,1);
  }
  requestAnimationFrame(loop);
})();

function openTableModal(){ document.getElementById('tableModal').classList.add('show'); }
function closeTableModal(){ document.getElementById('tableModal').classList.remove('show'); }

function selectMode(mode){
  selectedMode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-mode-'+mode).classList.add('active');
}

function showFeedback(text,ok){
  const fb=document.getElementById('feedbackText');
  fb.textContent=text;
  fb.style.background=ok?'#2fb873':'#e64c3c'; fb.style.color='#fff';
  fb.style.display='inline-block';
  clearTimeout(fb._t); fb._t=setTimeout(()=>fb.style.display='none',850);
}

function startGame(){
  initAudio();
  document.documentElement.requestFullscreen?.().catch(()=>{});
  score=0; streak=0;
  document.getElementById('scoreNum').textContent=0;
  document.getElementById('streakNum').textContent=0;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('topBar').style.display='flex';
  document.getElementById('gameBoard').style.display='flex';
  document.getElementById('modeTag').textContent=selectedMode==='all'?'1–10 Campur':'Perkalian '+selectedMode;
  nextQuestion();
}

function resetToStart(){
  document.exitFullscreen?.().catch(()=>{});
  document.getElementById('startScreen').style.display='flex';
  document.getElementById('topBar').style.display='none';
  document.getElementById('gameBoard').style.display='none';
}

function nextQuestion(){
  const n1=selectedMode==='all'?Math.floor(Math.random()*10)+1:parseInt(selectedMode);
  const n2=Math.floor(Math.random()*10)+1;
  currentQuestion={n1,n2,answer:n1*n2};
  document.getElementById('questionText').textContent=`${n1} × ${n2}`;
  renderBalloons();
}

function renderBalloons(){
  const area=document.getElementById('balloonArea');
  area.innerHTML='';
  let answers=[currentQuestion.answer], tries=0;
  while(answers.length<4 && tries<40){
    tries++;
    const offset=(Math.floor(Math.random()*6)+1)*(Math.random()<.5?1:-1);
    const wrong=currentQuestion.answer+offset;
    if(wrong>0 && wrong<=100 && !answers.includes(wrong)) answers.push(wrong);
  }
  answers.sort(()=>Math.random()-.5);

  answers.forEach(val=>{
    const color=COLORS[Math.floor(Math.random()*COLORS.length)];
    const wrap=document.createElement('div');
    wrap.className='balloon-wrapper'; wrap.tabIndex=0; wrap.setAttribute('role','button');
    wrap.setAttribute('aria-label','Jawaban '+val);
    wrap.innerHTML=`<div class="balloon" style="background:${color}">${val}</div>
      <div class="balloon-knot" style="border-top-color:${color}"></div>
      <div class="balloon-string"></div>`;
    const isCorrect=val===currentQuestion.answer;
    const handle=(clientX,clientY)=>onAnswer(isCorrect,wrap,color,clientX,clientY);
    wrap.addEventListener('pointerdown',e=>{e.preventDefault();handle(e.clientX,e.clientY);});
    wrap.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); const r=wrap.getBoundingClientRect(); handle(r.left+r.width/2,r.top+r.height/2); }
    });
    area.appendChild(wrap);
  });
}

function onAnswer(isCorrect,el,color,x,y){
  if(isCorrect){
    playPop(); burst(x,y,color,20); streak++;
    score+=10+Math.min(streak-1,5)*2;
    document.getElementById('scoreNum').textContent=score;
    document.getElementById('streakNum').textContent=streak;
    if(score>best){ best=score; document.getElementById('bestNum').textContent=best; try{localStorage.setItem('balonPerkalianBest',best);}catch(e){} }
    showFeedback(streak>=5?'Luar biasa! 🔥':'Hore! Benar! 🎉',true);
    if(streak>0 && streak%5===0) for(let i=0;i<3;i++) setTimeout(()=>burst(innerWidth*Math.random(),innerHeight*.3,COLORS[i%COLORS.length],25),i*120);
    nextQuestion();
  } else {
    playWrong(); streak=0; document.getElementById('streakNum').textContent=0;
    el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),400);
    showFeedback('Coba lagi! ❌',false);
  }
}
</script>
</body>
</html>
